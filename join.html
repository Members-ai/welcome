<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Request an invitation · The Clark–Wilson</title>
<meta name="description" content="Membership of The Clark–Wilson is by invitation. A person reads every request.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://clark-wilson.pages.dev/join">
<meta property="og:title" content="Request an invitation · The Clark–Wilson">
<meta property="og:description" content="Membership is by invitation. A person reads every request.">
<meta property="og:image" content="https://clark-wilson.pages.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --bg: #13110f; --ink: #ece9e2; --soft: #a8a49c; --muted: #807d77; --rule: #2b2825; --field: #0e0d0c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; font-size: 16px; }
  body {
    background: var(--bg); color: var(--ink);
    font: 1.0625rem/1.65 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .signin {
    position: absolute; top: 1.25rem; right: 1.5rem;
    font-size: 0.58rem; letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); padding-bottom: 0.3rem;
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  .signin:hover, .signin:focus-visible { color: var(--ink); border-bottom-color: var(--muted); outline: none; }
  main { max-width: 26rem; margin: 0 auto; padding: 14vh 1.5rem 3rem; text-align: center; }
  .brand { display: block; color: inherit; text-decoration: none; }
  .the { display: block; font-size: 0.7rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; }
  .mark { font-size: 1.15rem; letter-spacing: 0.32em; text-transform: uppercase; }
  .sub { margin-top: 1rem; font-size: 0.68rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--muted); }
  .rule { width: 2.5rem; height: 1px; background: var(--muted); opacity: 0.5; margin: 3rem auto; border: 0; }
  .asked { animation: reveal 0.8s ease both; margin-bottom: 3rem; }
  blockquote { font-size: 1.45rem; line-height: 1.4; overflow-wrap: anywhere; }
  blockquote::before { content: "\201C"; }
  blockquote::after { content: "\201D"; }
  .by { margin-top: 0.9rem; font-size: 0.9rem; font-style: italic; color: var(--soft); }
  h1 { font-size: 1.15rem; font-weight: 400; line-height: 1.5; }
  .lede { margin-top: 0.5rem; font-size: 0.9rem; font-style: italic; color: var(--soft); }
  form { display: grid; gap: 0.6rem; margin-top: 2.25rem; }
  label { position: absolute; left: -9999px; }
  input {
    width: 100%; font: inherit; text-align: center; color: var(--ink); background: var(--field);
    border: 1px solid var(--rule); border-radius: 2px; padding: 0.75rem 0.9rem; outline: none;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--muted); }
  button {
    font: inherit; font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--bg); background: var(--ink); border: 0; border-radius: 2px; padding: 0.95rem 1rem; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.6; cursor: default; }
  [hidden] { display: none !important; }
  .trap { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .note:empty { display: none; }
  .note { margin-top: 0.9rem; font-size: 0.82rem; font-style: italic; color: var(--soft); }
  .done { animation: reveal 0.8s ease both; padding: 2.25rem 0 0.2rem; }
  .done-a { font-size: 1.15rem; letter-spacing: 0.02em; }
  .done-b { margin-top: 0.5rem; font-size: 0.9rem; font-style: italic; color: var(--soft); }
  .done-c { margin-top: 1rem; font-size: 0.8rem; font-style: italic; color: var(--muted); }
  .back { margin-top: 3rem; font-size: 0.8rem; font-style: italic; color: var(--muted); }
  .back a { color: inherit; text-decoration-color: var(--rule); text-underline-offset: 0.25em; }
  @keyframes reveal { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .asked, .done { animation: none; } }
  @media (min-width: 700px) { main { padding-top: 11vh; } blockquote { font-size: 1.6rem; } }
</style>
</head>
<body>
<a class="signin" id="signin" href="https://github.com/login?return_to=%2FMembers-ai%2Fclark-wilson">Members sign in</a>
<main>
  <a class="brand" href="/">
    <span class="the">The</span>
    <span class="mark">Clark–Wilson</span>
    <p class="sub">Members only</p>
  </a>

  <hr class="rule">

  <div class="asked" id="asked" hidden>
    <blockquote id="title"></blockquote>
    <p class="by" id="by"></p>
  </div>

  <h1>Membership is by invitation.</h1>
  <p class="lede">A person reads every request.</p>

  <form id="request">
    <label for="user">GitHub username</label>
    <input id="user" name="user" placeholder="GitHub username" autocomplete="username"
           required pattern="[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})" autocapitalize="off" spellcheck="false">
    <input class="trap" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit">Request an invitation</button>
  </form>
  <p class="note" id="note" role="status" aria-live="polite"></p>
  <div class="done" id="done" role="status" hidden>
    <p class="done-a">Very good.</p>
    <p class="done-b">Your request has been received.</p>
    <p class="done-c">Kindly watch the inbox linked to your GitHub account for the invitation.</p>
  </div>

  <p class="back"><a href="/exchanges">See what members are asking</a></p>
</main>
<script>
  // Shows the question the visitor came from, set as text only.
  (function () {
    const q = (new URLSearchParams(location.search).get("q") || "").replace(/\D/g, "").slice(0, 7);
    if (!q) return;
    document.getElementById("signin").href =
      "https://github.com/login?return_to=" + encodeURIComponent("/Members-ai/clark-wilson/issues/" + q);
    fetch("/exchanges.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : {})
      .catch(() => ({}))
      .then(data => {
        const found = ((data && data.questions) || []).find(x => String(x.number) === q);
        if (!found) return;
        document.getElementById("title").textContent = found.title;
        document.getElementById("by").textContent = "— @" + found.asked_by;
        document.getElementById("asked").hidden = false;
      });
  })();
</script>
<script src="/request-form.js"></script>
</body>
</html>
