<title>The Clark–Wilson</title>
<script>
  // Forwards to the front page, carrying a question number across if there is one.
  (function () {
    const q = (new URLSearchParams(location.search).get("q") || "").replace(/\D/g, "").slice(0, 7);
    location.replace(q ? "/?q=" + q + "#request" : "/");
  })();
</script>
